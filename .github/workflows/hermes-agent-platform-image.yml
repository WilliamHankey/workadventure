name: Hermes agent platform image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "agent-platform/**"
      - "hermes-connector/**"
      - "libs/hermes-connector-protocol/**"
      - "libs/messages/**"
      - "messages/**"
      - "package-lock.json"
      - ".github/workflows/hermes-agent-platform-image.yml"
  push:
    branches: [feature/hermes-agent-platform]
    paths:
      - "agent-platform/**"
      - "hermes-connector/**"
      - "libs/hermes-connector-protocol/**"
      - "libs/messages/**"
      - "messages/**"
      - "package-lock.json"
      - ".github/workflows/hermes-agent-platform-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/workadventure-agent-platform" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agent-platform/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:feature-hermes-agent-platform
          cache-from: type=gha
          cache-to: type=gha,mode=max
