name: Hermes agent platform

on:
  pull_request:
    paths:
      - "agent-platform/**"
      - "hermes-connector/**"
      - "libs/hermes-connector-protocol/**"
      - "libs/messages/**"
      - "messages/**"
      - "play/src/pusher/**"
      - "play/tests/pusher/AgentIdentityController.test.ts"
      - "package-lock.json"
      - ".github/workflows/hermes-agent-platform.yml"
  push:
    branches: [feature/hermes-agent-platform]
    paths:
      - "agent-platform/**"
      - "hermes-connector/**"
      - "libs/hermes-connector-protocol/**"
      - "libs/messages/**"
      - "messages/**"
      - "play/src/pusher/**"
      - "play/tests/pusher/AgentIdentityController.test.ts"
      - "package-lock.json"
      - ".github/workflows/hermes-agent-platform.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ts-proto --workspace=messages
      - run: npm run typesafe-i18n --workspace=workadventure-play
      - run: npm run typecheck --workspace=@workadventure/hermes-connector-protocol
      - run: npm run lint --workspace=@workadventure/hermes-connector-protocol
      - run: npm run typecheck --workspace=@workadventure/hermes-connector
      - run: npm run lint --workspace=@workadventure/hermes-connector
      - run: npm test --workspace=@workadventure/hermes-connector -- --run
      - run: npm run typecheck --workspace=@workadventure/agent-platform
      - run: npm run lint --workspace=@workadventure/agent-platform
      - run: npm test --workspace=@workadventure/agent-platform -- --run
      - run: npm exec --workspace=workadventure-play -- tsc --noEmit --project tsconfig-pusher.json
      - run: npm exec --workspace=workadventure-play -- vitest run tests/pusher/AgentIdentityController.test.ts
